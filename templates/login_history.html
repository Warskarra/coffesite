{% extends "base.html" %}

{% block title %}Login History | Ameers Coffee{% endblock %}

{% block content %}
<div style="padding: 50px;">
    <h1 style="color: #deab5f;">Login History</h1>
    <table style="width: 100%; border-collapse: collapse; margin-top: 30px;">
        <tr style="background: #333;">
            <th style="padding: 15px; text-align: left;">Username</th>
            <th style="padding: 15px; text-align: left;">Time</th>
        </tr>
        {% for log in logs %}
        <tr style="border-bottom: 1px solid #333;">
            <td style="padding: 15px;">{{ log.username }}</td>
            <td style="padding: 15px;">{{ log.time }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
