{% extends "base.html" %}

{% block title %}Edit Item | Ameers Coffee{% endblock %}

{% block content %}
<div style="text-align: center; padding: 50px;">
    <h1>Edit Menu Item</h1>
    <form method="POST">
        <input type="text" name="name" value="{{ item.name }}" required>
        <br><br>
        <input type="text" name="description" value="{{ item.description }}" required>
        <br><br>
        <input type="text" name="price" value="{{ item.price }}" required>
        <br><br>
        <input type="text" name="image" value="{{ item.image }}" required>
        <br><br>
        <input type="text" name="category" value="{{ item.category }}" required>
        <br><br>
        <button type="submit">Save Changes</button>
    </form>
</div>
{% endblock %}
