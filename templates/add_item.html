{% extends "base.html" %}

{% block title %}Add Menu Item | Ameers Coffee{% endblock %}

{% block content %}
<div style="text-align: center; padding: 50px;">
    <h1>Add Menu Item</h1>
    <form method="POST">
        <input type="text" name="name" placeholder="Item name" required>
        <br><br>
        <input type="text" name="description" placeholder="Description" required>
        <br><br>
        <input type="text" name="price" placeholder="Price e.g 5.50" required>
        <br><br>
        <input type="text" name="image" placeholder="Image filename e.g 1.png" required>
        <br><br>
        <input type="text" name="category" placeholder="Category e.g Signature Brews" required>
        <br><br>
        <button type="submit">Add Item</button>
    </form>
</div>
{% endblock %}
